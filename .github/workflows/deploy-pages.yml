name: Publish Medicoprint microsite

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Prepare GitHub Pages
        uses: actions/configure-pages@v5
      - name: Assemble standalone site files
        run: |
          mkdir -p _site/assets _site/social-pages
          cp index.html styles.css script.js analytics-config.js analytics.js linkedin-preview.html dialyse-maroc.html _site/
          cp -R assets/social _site/assets/
          cp -R social-pages/. _site/social-pages/
          touch _site/.nojekyll
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
